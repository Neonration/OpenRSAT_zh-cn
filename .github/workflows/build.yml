name: Cross-Platform Build OpenRSAT

on:
  # push:
    # tags:
      # - 'v*'

  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: win64
            os: windows-latest

          - name: win32
            os: windows-latest

          - name: linux-x64
            os: ubuntu-24.04

          - name: linux-arm64
            os: ubuntu-24.04
          
          - name: macosx-intel
            os: macos-15-intel
            arch: x86_64

          - name: macosx-arm64
            os: macos-15
            arch: arm64

    name: Build OpenRSAT — ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Set up Python for pinned dependency preparation
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test dependency preparation
        run: python -B -m unittest discover -s tests/dependencies -v

      - name: Prepare pinned dependency patches
        run: python tools/prepare_dependencies.py

      - name: Setup 7-zip
        if: runner.os != 'macOS'
        uses: milliewalky/setup-7-zip@v2

      - name: Download and extract mORMot2 static (Unix based)
        if: matrix.target.os != 'windows-latest'
        run: |
          echo "Download mORMot2 static"
          curl -L -o mormot2static.7z https://synopse.info/files/mormot2static.7z

          if [ '${{ runner.os }}' = 'macOS' ]; then
            mkdir static
            tar -xf mormot2static.7z -C static
          else
            7z x -y mormot2static.7z -ostatic
          fi

          rm -rf submodules/mORMot2/static
          mv static submodules/mORMot2/static

          rm mormot2static.7z

      - name: Download and extract mORMot2 static (Windows)
        if: matrix.target.os == 'windows-latest'
        run: |
          echo "Download mORMot2 static"
          curl -L -o mormot2static.7z https://synopse.info/files/mormot2static.7z

          7z x -y mormot2static.7z -ostatic

          rm "submodules/mORMot2/static" -r -force
          mv static submodules/mORMot2/static

          rm mormot2static.7z -r -force

      - name: Install dependencies (Ubuntu only)
        if: matrix.target.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git subversion unzip \
            libx11-dev libgtk2.0-dev libgdk-pixbuf-2.0-dev \
            libcairo2-dev libpango1.0-dev texinfo bison

      - name: Build windres (Ubuntu only)
        if: matrix.target.os == 'ubuntu-24.04'
        run: |
          echo "Download"
          curl -L -o binutils-2.45.tar.xz https://github.com/osvegn/binutils/raw/refs/heads/main/binutils-2.45.tar.xz
          echo "Untar"
          tar -xf binutils-2.45.tar.xz
          echo "Change folder"
          cd binutils-2.45
          echo "configure"
          ./configure
          echo "make"
          make
          echo "make windres"
          cd binutils && make windres
          cp ./windres ../../

      - name: Download windres (Macos intel)
        if: matrix.target.name == 'macosx-intel'
        run: |
          curl -fL -o windres https://github.com/osvegn/binutils/raw/refs/heads/main/darwin/intel/windres

      - name: Download windres (Macos arm64)
        if: matrix.target.name == 'macosx-arm64'
        run: |
          curl -fL -o windres https://github.com/osvegn/binutils/raw/refs/heads/main/darwin/arm64/windres

      - name: Cache build windres (Ubuntu only)
        if: matrix.target.os == 'ubuntu-24.04'
        uses: actions/cache@v4
        with:
          path: binutils-2.45
          key: ${{ matrix.target.name }}-binutils-2.45

      - name: Copy windres
        if: matrix.target.os != 'windows-latest'
        run: |
          chmod 755 ./windres
          mkdir -p "$RUNNER_TEMP/openrsat-bin"
          cp ./windres "$RUNNER_TEMP/openrsat-bin/windres"
          echo "$RUNNER_TEMP/openrsat-bin" >> "$GITHUB_PATH"

      - name: Verify macOS runner architecture
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = '${{ matrix.target.arch }}'
          file ./windres
          lipo ./windres -verify_arch '${{ matrix.target.arch }}'
          ./windres --version

      - name: Install FPC and Lazarus IDE
        if: runner.os != 'macOS'
        uses: osvegn/setup-lazarus-fpcup@v1.0.1
        with:
          laz: lazarus_4_0
          fpc: release_3_2_2

      - name: Install native FPC and Lazarus (macOS)
        if: runner.os == 'macOS'
        run: |
          prefix="$RUNNER_TEMP/openrsat-fpcup"
          if [ '${{ matrix.target.arch }}' = 'arm64' ]; then
            installer=fpclazup-aarch64-darwin
            compiler=ppca64
          else
            installer=fpclazup-x86_64-darwin
            compiler=ppcx64
          fi
          curl -fL -o "$RUNNER_TEMP/fpclazup" "https://github.com/LongDirtyAnimAlf/Reiniero-fpcup/releases/download/v2.4.0f/$installer"
          chmod +x "$RUNNER_TEMP/fpclazup"
          lipo "$RUNNER_TEMP/fpclazup" -verify_arch '${{ matrix.target.arch }}'
          if [ '${{ matrix.target.arch }}' = 'x86_64' ]; then
            # FPC fixes_3_2 includes the Xcode 16 assembler fix; pin the revision.
            git init "$prefix/fpc"
            git -C "$prefix/fpc" remote add origin https://gitlab.com/freepascal.org/fpc/source
            git -C "$prefix/fpc" fetch --depth 1 origin 7a7bf815302b98f2b11dd201732e3f4d58b8c9bd
            git -C "$prefix/fpc" checkout --detach FETCH_HEAD
          else
            git clone --depth 1 --branch release_3_2_2 https://gitlab.com/freepascal.org/fpc/source "$prefix/fpc"
          fi
          git clone --depth 1 --branch lazarus_4_0 https://gitlab.com/freepascal.org/lazarus/lazarus "$prefix/lazarus"
          "$RUNNER_TEMP/fpclazup" --only=FPCCleanOnly,FPCBuildOnly,LazarusCleanOnly,LazBuild,LazarusConfigOnly --noconfirm --verbose --installdir="$prefix"
          compiler_path=$(find "$prefix/fpc/bin" -type f -name "$compiler" -print -quit)
          test -n "$compiler_path"
          file "$compiler_path"
          lipo "$compiler_path" -verify_arch '${{ matrix.target.arch }}'
          if [ '${{ matrix.target.arch }}' = 'x86_64' ]; then
            # Xcode 16's integrated assembler rejects some FPC-generated CFI labels.
            printf '%s\n' '-ao-Q' >> "$(dirname "$compiler_path")/fpc.cfg"
          fi
          echo "$prefix/lazarus" >> "$GITHUB_PATH"

      - name: Link dependencies
        run: |
          lazbuild --version
          lazbuild --add-package-link submodules/mORMot2/packages/lazarus/mormot2.lpk
          lazbuild --add-package-link submodules/pltis_uicomponents/pack/pltis_uicomponents.lpk
          lazbuild --add-package-link submodules/pltis_djoin/pack/pltis_djoin.lpk
          lazbuild --add-package-link submodules/pltis_utils/pltis_utils.lpk
          lazbuild --add-package-link submodules/pltis_virtualtrees/virtualtreeview_package.lpk
          lazbuild --add-package-link submodules/metadarkstyle/metadarkstyle.lpk
          lazbuild --add-package-link submodules/metadarkstyle/metadarkstyledsgn.lpk
          lazbuild --add-package-link packages/OpenRSATCore/OpenRSATCore.lpk
          lazbuild --add-package-link packages/OpenRSATGUI/OpenRSATGUI.lpk

      - name: Build offline console regression suite (Windows x64)
        if: matrix.target.name == 'win64'
        run: lazbuild --build-mode=test tests/openrsattests.lpi

      - name: Run offline console regression suite (Windows x64)
        if: matrix.target.name == 'win64'
        timeout-minutes: 5
        run: ./tests/openrsattests.exe --noenter

      - name: Build offline GUI regression suite (Windows x64)
        if: matrix.target.name == 'win64'
        run: lazbuild tests/gui/openrsattestsgui.lpi

      - name: Run offline GUI regression suite (Windows x64)
        if: matrix.target.name == 'win64'
        timeout-minutes: 5
        run: ./tests/gui/openrsattestsgui.exe --noenter

      - name: Build offline console regression suite (macOS native)
        if: runner.os == 'macOS'
        run: lazbuild --build-mode=test tests/openrsattests.lpi

      - name: Run offline console regression suite (macOS native)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          lipo tests/openrsattests -verify_arch '${{ matrix.target.arch }}'
          ./tests/openrsattests --noenter

      - name: Build OpenRSAT for ${{ matrix.target.name }}
        if: runner.os != 'macOS'
        run: lazbuild --build-mode=${{ matrix.target.name }} sources/OpenRSAT.lpi

      - name: Build OpenRSAT for ${{ matrix.target.name }} (macOS)
        if: runner.os == 'macOS'
        run: lazbuild --opt=-k-ld_classic --build-mode=${{ matrix.target.name }} sources/OpenRSAT.lpi

      - name: Verify macOS binary architecture
        if: runner.os == 'macOS'
        run: |
          file "bin/${{ matrix.target.name }}/OpenRSAT"
          lipo "bin/${{ matrix.target.name }}/OpenRSAT" -verify_arch '${{ matrix.target.arch }}'
          otool -L "bin/${{ matrix.target.name }}/OpenRSAT"

      - name: Include translations
        shell: bash
        run: |
          mkdir -p "bin/${{ matrix.target.name }}/locale"
          cp languages/OpenRSAT.*.po "bin/${{ matrix.target.name }}/locale/"

      - name: Create OpenRSAT.app folder
        if: runner.os == 'macOS'
        run: |
          mkdir -p OpenRSAT.app/Contents/MacOS
          mkdir -p OpenRSAT.app/Contents/Resources/locale
          cp languages/OpenRSAT.*.po OpenRSAT.app/Contents/Resources/locale/
          cat > OpenRSAT.app/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>OpenRSAT</string>
              <key>CFBundleIdentifier</key>
              <string>com.yourcompany.OpenRSAT</string>
              <key>CFBundleName</key>
              <string>OpenRSAT</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>NSHumanReadableCopyright</key>
              <string>Copyright © 2025 Tranquil IT. All rights reserved.</string>
              <key>CFBundleIconFile</key>
              <string>app.icns</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          plutil -lint OpenRSAT.app/Contents/Info.plist
          mv ./bin/${{ matrix.target.name }}/OpenRSAT OpenRSAT.app/Contents/MacOS

      - name: Create a temp dir for the DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg
          cp -R OpenRSAT.app dmg/

      - name: Create the DMG file
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "OpenRSAT" -srcfolder dmg -format UDZO OpenRSAT.dmg
          hdiutil verify OpenRSAT.dmg
          mkdir "$RUNNER_TEMP/openrsat-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/openrsat-dmg" OpenRSAT.dmg
          test -f "$RUNNER_TEMP/openrsat-dmg/OpenRSAT.app/Contents/MacOS/OpenRSAT"
          test -f "$RUNNER_TEMP/openrsat-dmg/OpenRSAT.app/Contents/Resources/locale/OpenRSAT.zh.po"
          hdiutil detach "$RUNNER_TEMP/openrsat-dmg"
          mv OpenRSAT.dmg ./bin/${{ matrix.target.name }}/

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenRSAT-${{ matrix.target.name }}
          path: ./bin/

